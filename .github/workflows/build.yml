name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/ClueMind-Setup.exe
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx electron-vite build
      # Unsigned DMG for CI — notarization comes later with an Apple Developer account
      - run: npx electron-builder --mac dmg --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Ensure ClueMind.dmg name
        run: |
          ls -la dist || true
          if [ -f dist/ClueMind.dmg ]; then
            echo "Found dist/ClueMind.dmg"
          else
            DMG=$(ls dist/*.dmg 2>/dev/null | head -n 1)
            if [ -n "$DMG" ]; then
              echo "Renaming $DMG -> dist/ClueMind.dmg"
              mv "$DMG" dist/ClueMind.dmg
            else
              echo "No DMG produced"
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: dist/ClueMind.dmg
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder --linux AppImage --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: dist/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
