<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClueMind</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse 70% 50% at 50% 30%, rgba(46,109,255,0.22), transparent 55%), #050814;
      font-family: "DM Sans", system-ui, sans-serif;
      color: #f3f6ff;
      overflow: hidden;
      user-select: none;
    }
    .wrap { text-align: center; }
    .logo {
      width: 110px;
      height: 110px;
      border-radius: 28px;
      object-fit: cover;
      display: block;
      margin: 0 auto 1.2rem;
      animation: float-y 2.6s ease-in-out infinite, float-glow 2.6s ease-in-out infinite;
    }
    @keyframes float-y {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }
    @keyframes float-glow {
      0%, 100% { filter: drop-shadow(0 12px 24px rgba(46,109,255,0.45)); }
      50% { filter: drop-shadow(0 20px 40px rgba(124,58,237,0.55)); }
    }
    h1 {
      font-size: 1.35rem;
      letter-spacing: -0.03em;
      margin-bottom: 0.35rem;
    }
    p { color: #8b9bb8; font-size: 0.92rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="./logo.png" alt="ClueMind" />
    <h1>ClueMind</h1>
    <p>Starting…</p>
  </div>
</body>
</html>
